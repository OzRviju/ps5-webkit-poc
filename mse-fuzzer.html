<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MSE SourceBuffer Fuzzer — PS5 WebKit</title>
<style>
body { background: #111; color: #0f0; font-family: monospace; padding: 20px; }
#log { white-space: pre-wrap; max-height: 80vh; overflow-y: auto; font-size: 12px; }
.crash { color: #f00; font-weight: bold; }
.info  { color: #0ff; }
.mut   { color: #ff0; }
button { margin: 4px; padding: 8px 16px; font-size: 14px; }
</style>
</head>
<body>
<h2>MSE SourceBuffer Fuzzer</h2>
<p class="info">Target: mediaplayer::PSSourceBufferBackend::append() via SourceBuffer.appendBuffer()</p>
<div>
  <button onclick="startFuzz('video/mp4; codecs=&quot;avc1.42E01E&quot;')">Fuzz MP4/H.264</button>
  <button onclick="startFuzz('video/mp4; codecs=&quot;hev1.1.6.L93.B0&quot;')">Fuzz MP4/HEVC</button>
  <button onclick="startFuzz('audio/mp4; codecs=&quot;mp4a.40.2&quot;')">Fuzz AAC</button>
  <button onclick="startFuzz('video/webm; codecs=&quot;vp8&quot;')">Fuzz WebM/VP8</button>
  <button onclick="stopFuzz()">STOP</button>
</div>
<div>Iterations: <span id="count">0</span> | Crashes: <span id="crashes">0</span> | Errors: <span id="errors">0</span></div>
<div id="log"></div>

<script>
"use strict";

const logEl = document.getElementById('log');
const countEl = document.getElementById('count');
const crashesEl = document.getElementById('crashes');
const errorsEl = document.getElementById('errors');

let running = false;
let iteration = 0;
let crashCount = 0;
let errorCount = 0;

function log(msg, cls) {
    const line = document.createElement('div');
    line.className = cls || '';
    line.textContent = `[${iteration}] ${msg}`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
}

// ========================================================================
// Minimal valid MP4 (ftyp + moov) seed — smallest parseable container
// ========================================================================
function buildMinimalMP4() {
    // ftyp box: file type
    const ftyp = new Uint8Array([
        0x00,0x00,0x00,0x1C, // size = 28
        0x66,0x74,0x79,0x70, // 'ftyp'
        0x69,0x73,0x6F,0x6D, // major_brand = 'isom'
        0x00,0x00,0x00,0x01, // minor_version = 1
        0x69,0x73,0x6F,0x6D, // compatible_brands: 'isom'
        0x61,0x76,0x63,0x31, // 'avc1'
        0x6D,0x70,0x34,0x31, // 'mp41'
    ]);

    // moov box with mvhd + trak (minimal, intentionally short)
    // mvhd: 108 bytes (version 0)
    const mvhd = new Uint8Array([
        0x00,0x00,0x00,0x6C, // size = 108
        0x6D,0x76,0x68,0x64, // 'mvhd'
        0x00,0x00,0x00,0x00, // version=0, flags=0
        0x00,0x00,0x00,0x00, // creation_time
        0x00,0x00,0x00,0x00, // modification_time
        0x00,0x00,0x03,0xE8, // timescale = 1000
        0x00,0x00,0x10,0x00, // duration = 4096
        0x00,0x01,0x00,0x00, // rate = 1.0
        0x01,0x00,           // volume = 1.0
        // 10 bytes reserved
        0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
        // matrix (36 bytes) — identity
        0x00,0x01,0x00,0x00, 0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
        0x00,0x00,0x00,0x00, 0x00,0x01,0x00,0x00, 0x00,0x00,0x00,0x00,
        0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00, 0x40,0x00,0x00,0x00,
        // pre_defined (24 bytes)
        0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
        0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
        // next_track_ID
        0x00,0x00,0x00,0x02,
    ]);

    // Minimal trak box (tkhd only — intentionally truncated to provoke parser edge cases)
    const tkhd = new Uint8Array([
        0x00,0x00,0x00,0x5C, // size = 92
        0x74,0x6B,0x68,0x64, // 'tkhd'
        0x00,0x00,0x00,0x01, // version=0, flags=1 (track_enabled)
        0x00,0x00,0x00,0x00, // creation_time
        0x00,0x00,0x00,0x00, // modification_time
        0x00,0x00,0x00,0x01, // track_ID = 1
        0x00,0x00,0x00,0x00, // reserved
        0x00,0x00,0x10,0x00, // duration = 4096
        0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00, // reserved
        0x00,0x00,           // layer
        0x00,0x00,           // alternate_group
        0x00,0x00,           // volume
        0x00,0x00,           // reserved
        // matrix (36 bytes)
        0x00,0x01,0x00,0x00, 0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
        0x00,0x00,0x00,0x00, 0x00,0x01,0x00,0x00, 0x00,0x00,0x00,0x00,
        0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00, 0x40,0x00,0x00,0x00,
        // width, height (16.16 fixed)
        0x01,0x40,0x00,0x00, // 320
        0x00,0xF0,0x00,0x00, // 240
    ]);

    const trakSize = 8 + tkhd.length;
    const trak = new Uint8Array(trakSize);
    const dv = new DataView(trak.buffer);
    dv.setUint32(0, trakSize);
    trak[4]=0x74; trak[5]=0x72; trak[6]=0x61; trak[7]=0x6B; // 'trak'
    trak.set(tkhd, 8);

    const moovSize = 8 + mvhd.length + trak.length;
    const moov = new Uint8Array(moovSize);
    const dv2 = new DataView(moov.buffer);
    dv2.setUint32(0, moovSize);
    moov[4]=0x6D; moov[5]=0x6F; moov[6]=0x6F; moov[7]=0x76; // 'moov'
    moov.set(mvhd, 8);
    moov.set(trak, 8 + mvhd.length);

    // Combine
    const result = new Uint8Array(ftyp.length + moov.length);
    result.set(ftyp, 0);
    result.set(moov, ftyp.length);
    return result;
}

// ========================================================================
// Minimal WebM seed
// ========================================================================
function buildMinimalWebM() {
    // EBML header + minimal Segment with Info
    return new Uint8Array([
        // EBML header
        0x1A,0x45,0xDF,0xA3, // EBML ID
        0x01,0x00,0x00,0x00,0x00,0x00,0x00,0x1F, // size
        0x42,0x86,0x81,0x01, // EBMLVersion: 1
        0x42,0xF7,0x81,0x01, // EBMLReadVersion: 1
        0x42,0xF2,0x81,0x04, // EBMLMaxIDLength: 4
        0x42,0xF3,0x81,0x08, // EBMLMaxSizeLength: 8
        0x42,0x82,0x84,0x77,0x65,0x62,0x6D, // DocType: "webm"
        0x42,0x87,0x81,0x04, // DocTypeVersion: 4
        0x42,0x85,0x81,0x02, // DocTypeReadVersion: 2
        // Segment
        0x18,0x53,0x80,0x67, // Segment ID
        0x01,0x00,0x00,0x00,0x00,0x00,0x00,0x28, // size (40)
        // Info element
        0x15,0x49,0xA9,0x66, // Info ID
        0x01,0x00,0x00,0x00,0x00,0x00,0x00,0x1C, // size
        0x2A,0xD7,0xB1,0x83,0x0F,0x42,0x40, // TimestampScale: 1000000
        0x44,0x89,0x84,0x41,0x20,0x00,0x00, // Duration (float 10.0)
        0x4D,0x80,0x84,0x74,0x65,0x73,0x74, // MuxingApp: "test"
        0x57,0x41,0x84,0x74,0x65,0x73,0x74, // WritingApp: "test"
    ]);
}

// ========================================================================
// Mutation strategies — target OOB via structure corruption
// ========================================================================
const STRATEGIES = [
    // 1. Corrupt box sizes (integer overflow → small alloc + large read/write)
    function corruptBoxSize(data) {
        const buf = new Uint8Array(data);
        // Find 4-byte size fields and replace with extreme values
        for (let i = 0; i < buf.length - 8; i += 4) {
            const size = (buf[i]<<24)|(buf[i+1]<<16)|(buf[i+2]<<8)|buf[i+3];
            if (size > 8 && size < buf.length * 2) {
                // Looks like a box size — mutate it
                const pick = Math.random();
                if (pick < 0.25) {
                    // 0xFFFFFFFF — trigger 32-bit overflow in size + offset calc
                    buf[i]=0xFF; buf[i+1]=0xFF; buf[i+2]=0xFF; buf[i+3]=0xFF;
                } else if (pick < 0.5) {
                    // 0x00000001 — size=1 means 64-bit extended size follows (but we don't provide it)
                    buf[i]=0; buf[i+1]=0; buf[i+2]=0; buf[i+3]=1;
                } else if (pick < 0.75) {
                    // 0x00000000 — size=0 means "extends to end of file" — parser must handle
                    buf[i]=0; buf[i+1]=0; buf[i+2]=0; buf[i+3]=0;
                } else {
                    // Negative-ish: size < 8 (invalid but parser may not check)
                    buf[i]=0; buf[i+1]=0; buf[i+2]=0; buf[i+3]=Math.floor(Math.random()*7)+1;
                }
                break; // one mutation per round
            }
        }
        return buf;
    },

    // 2. Truncate at random point (expose missing length checks)
    function truncate(data) {
        const cutPoint = Math.floor(Math.random() * (data.length - 8)) + 8;
        return new Uint8Array(data.buffer.slice(0, cutPoint));
    },

    // 3. Flip random bytes (bit-flip mutation)
    function bitFlip(data) {
        const buf = new Uint8Array(data);
        const nFlips = Math.floor(Math.random() * 8) + 1;
        for (let i = 0; i < nFlips; i++) {
            const pos = Math.floor(Math.random() * buf.length);
            buf[pos] ^= (1 << Math.floor(Math.random() * 8));
        }
        return buf;
    },

    // 4. Insert large count fields (overflow array allocations)
    function largeCount(data) {
        const buf = new Uint8Array(data);
        // Inject 0x7FFFFFFF at random aligned position
        const pos = Math.floor(Math.random() * (buf.length - 4));
        buf[pos]=0x7F; buf[pos+1]=0xFF; buf[pos+2]=0xFF; buf[pos+3]=0xFF;
        return buf;
    },

    // 5. Duplicate + extend (create overlapping box references)
    function duplicate(data) {
        const extra = new Uint8Array(data.length * 2);
        extra.set(data, 0);
        extra.set(data, data.length);
        // Fixup: set first ftyp to cover full size (overflow)
        const dv = new DataView(extra.buffer);
        dv.setUint32(0, extra.length);
        return extra;
    },

    // 6. Zero-fill interior (null deref / division by zero in codec params)
    function zeroInterior(data) {
        const buf = new Uint8Array(data);
        const start = 8 + Math.floor(Math.random() * (buf.length - 16));
        const len = Math.min(Math.floor(Math.random() * 32) + 4, buf.length - start);
        buf.fill(0, start, start + len);
        return buf;
    },

    // 7. Swap box type IDs (confuse parser state machine)
    function swapBoxType(data) {
        const buf = new Uint8Array(data);
        const boxTypes = [
            [0x6D,0x6F,0x6F,0x76], // moov
            [0x6D,0x64,0x61,0x74], // mdat
            [0x6D,0x6F,0x6F,0x66], // moof
            [0x73,0x69,0x64,0x78], // sidx
            [0x73,0x73,0x69,0x78], // ssix
            [0x73,0x74,0x73,0x7A], // stsz
            [0x73,0x74,0x63,0x6F], // stco
            [0x63,0x6F,0x36,0x34], // co64
            [0x73,0x74,0x73,0x63], // stsc
            [0x73,0x74,0x74,0x73], // stts
            [0x63,0x74,0x74,0x73], // ctts
            [0x74,0x72,0x75,0x6E], // trun
        ];
        // Replace a box type at a random position
        if (buf.length > 12) {
            const pos = 4 + Math.floor(Math.random() * (buf.length - 8));
            const newType = boxTypes[Math.floor(Math.random() * boxTypes.length)];
            buf[pos]=newType[0]; buf[pos+1]=newType[1]; buf[pos+2]=newType[2]; buf[pos+3]=newType[3];
        }
        return buf;
    },

    // 8. Integer overflow in dimensions (width*height*bpp overflow)
    function overflowDimensions(data) {
        const buf = new Uint8Array(data);
        // Search for width/height-like 16.16 fixed-point values and set to huge
        for (let i = 0; i < buf.length - 8; i++) {
            // Look for plausible width (0x01400000 = 320) or height patterns
            if (buf[i] === 0x01 && buf[i+1] === 0x40 && buf[i+2] === 0x00 && buf[i+3] === 0x00) {
                // Set width to 0x7FFF0000 (~2 billion in 16.16)
                buf[i]=0x7F; buf[i+1]=0xFF; buf[i+2]=0x00; buf[i+3]=0x00;
                if (i+4 < buf.length - 3) {
                    buf[i+4]=0x7F; buf[i+5]=0xFF; buf[i+6]=0x00; buf[i+7]=0x00;
                }
                break;
            }
        }
        return buf;
    },
];

// ========================================================================
// Core fuzzing loop
// ========================================================================
async function fuzzIteration(mimeType) {
    return new Promise((resolve) => {
        const timeout = setTimeout(() => {
            log('Timeout (possible hang — interesting!)', 'mut');
            cleanup();
            resolve('timeout');
        }, 5000);

        let video, ms, sb;

        function cleanup() {
            clearTimeout(timeout);
            try { if (sb && ms && ms.readyState === 'open') ms.removeSourceBuffer(sb); } catch(e) {}
            try { if (ms) ms.endOfStream(); } catch(e) {}
            try { if (video) { video.pause(); video.removeAttribute('src'); video.load(); video.remove(); } } catch(e) {}
        }

        try {
            video = document.createElement('video');
            ms = new MediaSource();
            video.src = URL.createObjectURL(ms);

            ms.addEventListener('sourceopen', () => {
                try {
                    if (!MediaSource.isTypeSupported(mimeType)) {
                        log(`MIME type not supported: ${mimeType}`, 'info');
                        cleanup();
                        resolve('unsupported');
                        return;
                    }

                    sb = ms.addSourceBuffer(mimeType);

                    // Pick seed based on mime
                    let seed;
                    if (mimeType.includes('webm')) {
                        seed = buildMinimalWebM();
                    } else {
                        seed = buildMinimalMP4();
                    }

                    // Apply random mutation strategy
                    const strategy = STRATEGIES[Math.floor(Math.random() * STRATEGIES.length)];
                    const mutated = strategy(seed);

                    log(`Strategy: ${strategy.name}, size: ${mutated.length}`, 'mut');

                    sb.addEventListener('error', (e) => {
                        errorCount++;
                        errorsEl.textContent = errorCount;
                        // An error in the parser — normal for invalid data.
                        // But if klog shows a SIGSEGV/SIGBUS right before this, that's the bug.
                        log(`SourceBuffer error event (check klog for crash!)`, 'info');
                        cleanup();
                        resolve('error');
                    });

                    sb.addEventListener('updateend', () => {
                        cleanup();
                        resolve('ok');
                    });

                    sb.appendBuffer(mutated.buffer);

                } catch(e) {
                    if (e.name === 'QuotaExceededError' || e.name === 'NotSupportedError') {
                        log(`Exception: ${e.name}: ${e.message}`, 'info');
                    } else {
                        log(`UNEXPECTED EXCEPTION: ${e.name}: ${e.message}`, 'crash');
                        crashCount++;
                        crashesEl.textContent = crashCount;
                    }
                    cleanup();
                    resolve('exception');
                }
            });

            ms.addEventListener('error', () => {
                log('MediaSource error', 'info');
                cleanup();
                resolve('ms-error');
            });

        } catch(e) {
            log(`Top-level crash: ${e.name}: ${e.message}`, 'crash');
            crashCount++;
            crashesEl.textContent = crashCount;
            resolve('crash');
        }
    });
}

async function startFuzz(mimeType) {
    if (running) return;
    running = true;
    iteration = 0;
    crashCount = 0;
    errorCount = 0;
    logEl.innerHTML = '';
    log(`Starting fuzzer with MIME: ${mimeType}`, 'info');
    log(`Monitor klog for SIGSEGV / SIGBUS / page fault`, 'info');
    log(`Each iteration = one mutated container → appendBuffer()`, 'info');
    log('─'.repeat(60), 'info');

    while (running) {
        iteration++;
        countEl.textContent = iteration;
        const result = await fuzzIteration(mimeType);

        // Brief delay to let the GC breathe and not lock the page
        await new Promise(r => setTimeout(r, 50));

        // Every 100 iterations, force GC pressure
        if (iteration % 100 === 0) {
            log(`── ${iteration} iterations, ${crashCount} crashes, ${errorCount} errors ──`, 'info');
        }
    }
}

function stopFuzz() {
    running = false;
    log('Stopped.', 'info');
}

// Global error handler — catches unhandled exceptions from the parser backend
window.onerror = function(msg, src, line, col, err) {
    crashCount++;
    crashesEl.textContent = crashCount;
    log(`GLOBAL ERROR: ${msg} at ${src}:${line}:${col}`, 'crash');
};
</script>
</body>
</html>
